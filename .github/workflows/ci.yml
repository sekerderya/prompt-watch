name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A throwaway Postgres so the route handlers can be exercised against a real
    # database. Unit tests alone cannot reach the advisory locks, the enum
    # constraints or the outcome join — the places bugs actually hid.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: promptwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The database tests refuse to run unless the database name ends in
      # "_test", so this cannot be pointed at anything real by accident.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/promptwatch_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=packages/sdk

      - name: Prisma generate
        run: npx prisma generate --schema=apps/web/prisma/schema.prisma

      # Every step below can fail the build. The previous version wrapped lint
      # in an `if` that echoed "Lint skipped" and exited 0, so the badge stayed
      # green whether or not anything was checked.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run SDK tests
        run: npm run test --workspace=packages/sdk

      - name: Run web unit tests
        run: npm run test --workspace=apps/web

      - name: Run database tests
        run: npm run test:db --workspace=apps/web

      - name: Build full project
        run: npm run build

      - name: Build production image
        run: docker build -f apps/web/Dockerfile -t promptwatch-web:ci .
