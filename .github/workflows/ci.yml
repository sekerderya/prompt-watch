name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Prisma needs a connection string to generate the client, even though
      # these tests do not open a connection.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=packages/sdk

      - name: Prisma generate
        run: npx prisma generate --schema=apps/web/prisma/schema.prisma

      # Every step below can fail the build. The previous version wrapped lint
      # in an `if` that echoed "Lint skipped" and exited 0, so the badge stayed
      # green whether or not anything was checked.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run SDK tests
        run: npm run test --workspace=packages/sdk

      - name: Run web tests
        run: npm run test --workspace=apps/web

      - name: Build full project
        run: npm run build

      - name: Build production image
        run: docker build -f apps/web/Dockerfile -t promptwatch-web:ci .
