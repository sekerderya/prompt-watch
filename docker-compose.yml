services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promptwatch
      POSTGRES_PASSWORD: promptwatch
      POSTGRES_DB: promptwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://promptwatch:promptwatch@postgres:5432/promptwatch
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      # Isolate Next.js build output so a host-side `npm run build` (production .next)
      # never collides with the dev server's own .next inside the container.
      - web_next:/app/apps/web/.next

volumes:
  pgdata:
  web_next: